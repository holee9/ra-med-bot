services:
  db:
    image: pgvector/pgvector:pg16
    container_name: regula-test-db
    environment:
      POSTGRES_DB: regula_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d regula_test"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - regula-test-db:/var/lib/postgresql/data

volumes:
  regula-test-db:
