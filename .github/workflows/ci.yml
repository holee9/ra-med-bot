name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: CI Gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm ci:typecheck

      - name: Lint
        run: pnpm ci:lint
        continue-on-error: false

      - name: Format check
        run: pnpm ci:format
        continue-on-error: false

      - name: Unit tests
        run: pnpm ci:test

      - name: RBAC coverage
        run: pnpm ci:rbac

      - name: Audit completeness
        run: pnpm ci:audit
        continue-on-error: true

      - name: Token symmetry
        run: pnpm ci:tokens
        continue-on-error: true

      - name: i18n completeness
        run: pnpm ci:i18n

      - name: Regulatory glossary
        run: pnpm ci:glossary

      - name: Contrast check
        run: pnpm ci:contrast
        continue-on-error: true

      - name: Module boundaries
        run: pnpm ci:module-boundaries

      - name: Migration sequence
        run: pnpm ci:migrations

      - name: Build
        run: pnpm ci:build
        env:
          SKIP_ENV_VALIDATION: true
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/regula_ci"
          AUTH_SECRET: "ci-build-placeholder-secret-minimum-32-characters"
          NEXTAUTH_URL: "http://localhost:3000"
          AUTH_MICROSOFT_ID: "ci-placeholder-microsoft-id"
          AUTH_MICROSOFT_SECRET: "ci-placeholder-microsoft-secret"
          AUTH_GOOGLE_ID: "ci-placeholder-google-id"
          AUTH_GOOGLE_SECRET: "ci-placeholder-google-secret"
