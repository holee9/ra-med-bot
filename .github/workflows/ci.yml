name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: CI Gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm ci:typecheck

      - name: Lint
        run: pnpm ci:lint
        continue-on-error: false

      - name: Format check
        run: pnpm ci:format
        continue-on-error: false

      - name: Unit tests
        run: pnpm ci:test

      - name: RBAC coverage
        run: pnpm ci:rbac

      - name: Audit completeness
        run: pnpm ci:audit
        continue-on-error: true

      - name: Token symmetry
        run: pnpm ci:tokens
        continue-on-error: true

      - name: i18n completeness
        run: pnpm ci:i18n

      - name: Regulatory glossary
        run: pnpm ci:glossary

      - name: Contrast check
        run: pnpm ci:contrast
        continue-on-error: true

      - name: Module boundaries
        run: pnpm ci:module-boundaries

      - name: Migration sequence
        run: pnpm ci:migrations

      - name: Build
        run: pnpm ci:build
        env:
          SKIP_ENV_VALIDATION: 1
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/regula_ci"
          AUTH_SECRET: "ci-build-placeholder-secret-minimum-32-characters"
          NEXTAUTH_URL: "http://localhost:3000"
          AUTH_MICROSOFT_ID: "ci-placeholder-microsoft-id"
          AUTH_MICROSOFT_SECRET: "ci-placeholder-microsoft-secret"
          AUTH_GOOGLE_ID: "ci-placeholder-google-id"
          AUTH_GOOGLE_SECRET: "ci-placeholder-google-secret"

  eval:
    name: LLM Eval Harness
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 30
    needs: [ci]
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_EVAL }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Skip promptfoo eval when eval secret is missing
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::notice::Skipping LLM eval because ANTHROPIC_API_KEY_EVAL is not configured."

      - name: Run promptfoo eval
        if: env.ANTHROPIC_API_KEY != ''
        run: pnpm eval:ci

      - name: Upload eval results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: tests/eval/results/

  e2e:
    name: Playwright E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: [ci]
    env:
      PLAYWRIGHT_BASE_URL: ${{ secrets.STAGING_URL }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Skip E2E when staging URL is missing
        if: env.PLAYWRIGHT_BASE_URL == ''
        run: echo "::notice::Skipping Playwright E2E because STAGING_URL is not configured."

      - name: Install Playwright browsers
        if: env.PLAYWRIGHT_BASE_URL != ''
        run: pnpm playwright install --with-deps ${{ matrix.browser }}

      - name: Run E2E tests
        if: env.PLAYWRIGHT_BASE_URL != ''
        run: pnpm playwright test --project=${{ matrix.browser }}
        env:
          CI: 'true'
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          PLAYWRIGHT_AUTH_STATE: tests/e2e/fixtures/.auth.json

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-${{ matrix.browser }}
          path: test-results/

      - name: Upload .auth.json artifact (debug only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-auth-state-${{ matrix.browser }}
          path: tests/e2e/fixtures/.auth.json
          retention-days: 7
          if-no-files-found: ignore
