name: Wave Progress Tracker

# Trigger: any PR merged to main
on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  # ─── Helper: Detect which Tn was merged ────────────────────────────────────
  detect-terminal:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      tn: ${{ steps.detect.outputs.tn }}
      issue: ${{ steps.detect.outputs.issue }}
      skip: ${{ steps.detect.outputs.skip }}
    steps:
      - name: Detect terminal from PR
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            const issueSpecMap = {
              97: 'T1', 98: 'T2', 99: 'T3', 100: 'T4'
            };
            const prBody = context.payload.pull_request.body || '';
            const closesMatches = [...prBody.matchAll(/[Cc]loses\s+#(\d+)/g)];
            const closedIssues = closesMatches.map(m => parseInt(m[1]));

            let tn = '', issue = '';
            for (const issueNum of closedIssues) {
              if (issueSpecMap[issueNum]) {
                tn = issueSpecMap[issueNum];
                issue = String(issueNum);
                break;
              }
            }

            if (!tn) {
              core.setOutput('tn', '');
              core.setOutput('issue', '');
              core.setOutput('skip', 'true');
            } else {
              core.setOutput('tn', tn);
              core.setOutput('issue', issue);
              core.setOutput('skip', 'false');
            }

  # ─── Job 1: T1 merged ──────────────────────────────────────────────────────
  on-t1-merge:
    needs: detect-terminal
    if: needs.detect-terminal.outputs.tn == 'T1'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Comment on Issue #101
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: 101
          body: |
            **[Auto] T1 merged.** T3 may rebase now.

            Run: `./scripts/release-rc1/merge-gate.sh --rebase T3`

            Wave A status: T1 ✅ | T2 ⏳ | T3 ⏳

      - name: Emit t3-rebase-ready repository dispatch
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 't3-rebase-ready',
              client_payload: {
                source: 'wave-progress-tracker',
                triggered_by: 'T1-merge',
                pr_number: context.payload.pull_request.number
              }
            });
            console.log('Dispatched t3-rebase-ready event');

  # ─── Job 2: T2 merged ──────────────────────────────────────────────────────
  on-t2-merge:
    needs: detect-terminal
    if: needs.detect-terminal.outputs.tn == 'T2'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Comment on Issue #101
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: 101
          body: |
            **[Auto] T2 merged.** Deploy pipeline (SPEC-REGULA-DEPLOY-001) is now active.

            Wave A status: T1 ⏳ | T2 ✅ | T3 ⏳

  # ─── Job 3: T3 merged ──────────────────────────────────────────────────────
  on-t3-merge:
    needs: detect-terminal
    if: needs.detect-terminal.outputs.tn == 'T3'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Check Wave A completion
        id: wave_a_check
        uses: actions/github-script@v7
        with:
          script: |
            // Check if T1 (#97) and T2 (#98) are closed
            const t1Issue = await github.rest.issues.get({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: 97
            });
            const t2Issue = await github.rest.issues.get({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: 98
            });

            const t1Done = t1Issue.data.state === 'closed';
            const t2Done = t2Issue.data.state === 'closed';
            const waveADone = t1Done && t2Done;

            console.log(`Wave A check: T1=${t1Done}, T2=${t2Done}, complete=${waveADone}`);
            core.setOutput('wave_a_done', String(waveADone));

      - name: Comment on Issue #101
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: 101
          body: |
            **[Auto] T3 merged.** Wave A status checking...

            Wave A complete: ${{ steps.wave_a_check.outputs.wave_a_done == 'true' && '✅ YES' || '⏳ Waiting for T1/T2' }}

      - name: Trigger Wave B if Wave A complete
        if: steps.wave_a_check.outputs.wave_a_done == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'wave-b-trigger.yml',
              ref: 'main',
              inputs: {
                triggered_by: 'wave-progress-tracker',
                pr_number: String(context.payload.pull_request.number)
              }
            });
            console.log('Triggered wave-b-trigger.yml workflow');

  # ─── Job 4: General wave status monitor ────────────────────────────────────
  wave-status-monitor:
    needs: detect-terminal
    if: needs.detect-terminal.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Check all Wave A PRs
        id: all_check
        uses: actions/github-script@v7
        with:
          script: |
            const issues = [
              { num: 97, tn: 'T1' },
              { num: 98, tn: 'T2' },
              { num: 99, tn: 'T3' },
            ];

            const statuses = [];
            for (const { num, tn } of issues) {
              const issue = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: num
              }).catch(() => ({ data: { state: 'unknown' } }));
              statuses.push({ tn, num, state: issue.data.state });
            }

            const allDone = statuses.every(s => s.state === 'closed');
            const statusText = statuses.map(s =>
              `${s.tn} (#${s.num}): ${s.state === 'closed' ? '✅' : '⏳'}`
            ).join(' | ');

            core.setOutput('all_wave_a_done', String(allDone));
            core.setOutput('status_text', statusText);
            console.log(`Wave A: ${statusText}`);

      - name: Trigger Wave B dispatch if all T1+T2+T3 done
        if: |
          steps.all_check.outputs.all_wave_a_done == 'true' &&
          needs.detect-terminal.outputs.tn == 'T3'
        uses: actions/github-script@v7
        with:
          script: |
            // Only dispatch if not already triggered by on-t3-merge job
            // (wave-b-trigger.yml is idempotent — handles duplicate calls)
            console.log('Wave A confirmed complete from status monitor — Wave B dispatch already handled by on-t3-merge job');
