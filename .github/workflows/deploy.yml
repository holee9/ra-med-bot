name: Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  vercel-preview:
    name: vercel-preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true
    environment: preview
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: 1
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/regula_ci"
          AUTH_SECRET: "ci-build-placeholder-secret-minimum-32-characters"
          NEXTAUTH_URL: "http://localhost:3000"
          AUTH_MICROSOFT_ID: "ci-placeholder-microsoft-id"
          AUTH_MICROSOFT_SECRET: "ci-placeholder-microsoft-secret"
          AUTH_GOOGLE_ID: "ci-placeholder-google-id"
          AUTH_GOOGLE_SECRET: "ci-placeholder-google-secret"
          ANTHROPIC_API_KEY: "ci-placeholder-anthropic-key"
          OPENAI_API_KEY: "ci-placeholder-openai-key"

      - name: Check Vercel preview credentials
        id: vercel_creds
        shell: bash
        run: |
          if [[ -n "${VERCEL_TOKEN}" && -n "${VERCEL_ORG_ID}" && -n "${VERCEL_PROJECT_ID}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel preview secrets are not configured; skipping preview deploy."
          fi

      - name: Install Vercel CLI
        if: steps.vercel_creds.outputs.enabled == 'true'
        run: pnpm add -g vercel

      - name: Pull Vercel environment (preview)
        if: steps.vercel_creds.outputs.enabled == 'true'
        run: vercel pull --yes --environment=preview --token="${VERCEL_TOKEN}"

      - name: Build Vercel artifacts (preview)
        if: steps.vercel_creds.outputs.enabled == 'true'
        run: vercel build --token="${VERCEL_TOKEN}"

      - name: Deploy to Vercel (preview)
        id: deploy
        if: steps.vercel_creds.outputs.enabled == 'true'
        run: |
          URL=$(vercel deploy --prebuilt --token="${VERCEL_TOKEN}")
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        if: steps.vercel_creds.outputs.enabled == 'true' && steps.deploy.outputs.preview_url != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Preview deployed: ${{ steps.deploy.outputs.preview_url }}`
            })

  cloudflare-staging:
    name: cloudflare-staging
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    outputs:
      staging_url: ${{ steps.staging_url.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: 1
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/regula_ci"
          AUTH_SECRET: "ci-build-placeholder-secret-minimum-32-characters"
          NEXTAUTH_URL: "http://localhost:3000"
          AUTH_MICROSOFT_ID: "ci-placeholder-microsoft-id"
          AUTH_MICROSOFT_SECRET: "ci-placeholder-microsoft-secret"
          AUTH_GOOGLE_ID: "ci-placeholder-google-id"
          AUTH_GOOGLE_SECRET: "ci-placeholder-google-secret"
          ANTHROPIC_API_KEY: "ci-placeholder-anthropic-key"
          OPENAI_API_KEY: "ci-placeholder-openai-key"

      - name: Check Cloudflare staging credentials
        id: cf_creds
        shell: bash
        run: |
          if [[ -n "${CLOUDFLARE_API_TOKEN}" && -n "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare staging secrets are not configured; skipping staging deploy."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Install Wrangler CLI
        if: steps.cf_creds.outputs.enabled == 'true'
        run: pnpm add -g wrangler

      - name: Deploy to Cloudflare (staging)
        if: steps.cf_creds.outputs.enabled == 'true'
        run: wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Export staging URL
        id: staging_url
        if: steps.cf_creds.outputs.enabled == 'true'
        shell: bash
        run: echo "url=${CLOUDFLARE_STAGING_URL:-https://staging.ra-med-bot.pages.dev}" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_STAGING_URL: ${{ vars.CLOUDFLARE_STAGING_URL }}

  vercel-production:
    name: vercel-production
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/release/v')
    environment: production-vercel
    outputs:
      production_url: ${{ steps.deploy.outputs.production_url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: 1
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/regula_ci"
          AUTH_SECRET: "ci-build-placeholder-secret-minimum-32-characters"
          NEXTAUTH_URL: "http://localhost:3000"
          AUTH_MICROSOFT_ID: "ci-placeholder-microsoft-id"
          AUTH_MICROSOFT_SECRET: "ci-placeholder-microsoft-secret"
          AUTH_GOOGLE_ID: "ci-placeholder-google-id"
          AUTH_GOOGLE_SECRET: "ci-placeholder-google-secret"
          ANTHROPIC_API_KEY: "ci-placeholder-anthropic-key"
          OPENAI_API_KEY: "ci-placeholder-openai-key"

      - name: Check Vercel production credentials
        id: vercel_creds
        shell: bash
        run: |
          if [[ -n "${VERCEL_TOKEN}" && -n "${VERCEL_ORG_ID}" && -n "${VERCEL_PROJECT_ID}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel production secrets are not configured; skipping production deploy."
          fi

      - name: Install Vercel CLI
        if: steps.vercel_creds.outputs.enabled == 'true'
        run: pnpm add -g vercel

      - name: Pull Vercel environment (production)
        if: steps.vercel_creds.outputs.enabled == 'true'
        run: vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"

      - name: Build Vercel artifacts (production)
        if: steps.vercel_creds.outputs.enabled == 'true'
        run: vercel build --prod --token="${VERCEL_TOKEN}"

      - name: Deploy to Vercel (production)
        id: deploy
        if: steps.vercel_creds.outputs.enabled == 'true'
        run: |
          URL=$(vercel deploy --prebuilt --prod --token="${VERCEL_TOKEN}")
          echo "production_url=$URL" >> "$GITHUB_OUTPUT"

  post-deploy-smoke:
    name: post-deploy-smoke
    runs-on: ubuntu-latest
    needs: [vercel-preview, cloudflare-staging, vercel-production]
    if: always() && ((needs.vercel-preview.result == 'success' && needs.vercel-preview.outputs.preview_url != '') || (needs.cloudflare-staging.result == 'success' && needs.cloudflare-staging.outputs.staging_url != '') || (needs.vercel-production.result == 'success' && needs.vercel-production.outputs.production_url != ''))
    steps:
      - uses: actions/checkout@v4

      - name: Determine BASE_URL
        id: base_url
        uses: actions/github-script@v7
        with:
          script: |
            const previewResult = '${{ needs.vercel-preview.result }}';
            const stagingResult = '${{ needs.cloudflare-staging.result }}';
            const productionResult = '${{ needs.vercel-production.result }}';
            const previewUrl = '${{ needs.vercel-preview.outputs.preview_url }}';
            const stagingUrl = '${{ needs.cloudflare-staging.outputs.staging_url }}';
            const productionUrl = '${{ needs.vercel-production.outputs.production_url }}';

            if (productionResult === 'success' && productionUrl) {
              core.setOutput('url', productionUrl);
            } else if (stagingResult === 'success' && stagingUrl) {
              core.setOutput('url', stagingUrl);
            } else if (previewResult === 'success' && previewUrl) {
              core.setOutput('url', previewUrl);
            } else {
              core.setFailed('No deployed URL is available for post-deploy smoke tests.');
            }

      - name: Run post-deploy smoke tests
        id: smoke
        run: bash scripts/post-deploy-smoke.sh
        env:
          BASE_URL: ${{ steps.base_url.outputs.url }}
        continue-on-error: true

      - name: Mark deployment unhealthy on failure
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "Smoke tests failed for ${{ steps.base_url.outputs.url }} — marking deployment unhealthy."
          curl -sf -X POST "https://api.vercel.com/v1/deployments/mark-unhealthy" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"url":"${{ steps.base_url.outputs.url }}","reason":"post-deploy smoke test failure"}' \
            || true

      - name: Post smoke result on PR
        if: needs.vercel-preview.result == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.smoke.outcome }}';
            const icon = outcome === 'success' ? 'green_circle' : 'red_circle';
            const label = outcome === 'success' ? 'passed' : 'FAILED';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `:${icon}: Post-deploy smoke tests ${label} for preview deployment.`
            });

      - name: Post smoke result on release
        if: needs.vercel-production.result == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.smoke.outcome }}';
            const icon = outcome === 'success' ? 'green_circle' : 'red_circle';
            const label = outcome === 'success' ? 'passed' : 'FAILED';
            await github.rest.releases.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id,
              body: (context.payload.release.body || '') +
                `\n\n:${icon}: Post-deploy smoke tests ${label}.`
            });

      - name: Fail job if smoke tests failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
