name: Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  vercel-preview:
    name: vercel-preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    environment: preview
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: 1
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/regula_ci"
          AUTH_SECRET: "ci-build-placeholder-secret-minimum-32-characters"
          NEXTAUTH_URL: "http://localhost:3000"
          AUTH_MICROSOFT_ID: "ci-placeholder-microsoft-id"
          AUTH_MICROSOFT_SECRET: "ci-placeholder-microsoft-secret"
          AUTH_GOOGLE_ID: "ci-placeholder-google-id"
          AUTH_GOOGLE_SECRET: "ci-placeholder-google-secret"
          ANTHROPIC_API_KEY: "ci-placeholder-anthropic-key"
          OPENAI_API_KEY: "ci-placeholder-openai-key"

      - name: Install Vercel CLI
        run: pnpm add -g vercel

      - name: Pull Vercel environment (preview)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel artifacts (preview)
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (preview)
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Preview deployed: ${{ steps.deploy.outputs.preview_url }}`
            })

  cloudflare-staging:
    name: cloudflare-staging
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: 1
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/regula_ci"
          AUTH_SECRET: "ci-build-placeholder-secret-minimum-32-characters"
          NEXTAUTH_URL: "http://localhost:3000"
          AUTH_MICROSOFT_ID: "ci-placeholder-microsoft-id"
          AUTH_MICROSOFT_SECRET: "ci-placeholder-microsoft-secret"
          AUTH_GOOGLE_ID: "ci-placeholder-google-id"
          AUTH_GOOGLE_SECRET: "ci-placeholder-google-secret"
          ANTHROPIC_API_KEY: "ci-placeholder-anthropic-key"
          OPENAI_API_KEY: "ci-placeholder-openai-key"

      - name: Deploy to Cloudflare (staging)
        run: pnpm wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  vercel-production:
    name: vercel-production
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/release/v')
    environment: production-vercel
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: 1
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/regula_ci"
          AUTH_SECRET: "ci-build-placeholder-secret-minimum-32-characters"
          NEXTAUTH_URL: "http://localhost:3000"
          AUTH_MICROSOFT_ID: "ci-placeholder-microsoft-id"
          AUTH_MICROSOFT_SECRET: "ci-placeholder-microsoft-secret"
          AUTH_GOOGLE_ID: "ci-placeholder-google-id"
          AUTH_GOOGLE_SECRET: "ci-placeholder-google-secret"
          ANTHROPIC_API_KEY: "ci-placeholder-anthropic-key"
          OPENAI_API_KEY: "ci-placeholder-openai-key"

      - name: Install Vercel CLI
        run: pnpm add -g vercel

      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel artifacts (production)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (production)
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "production_url=$URL" >> "$GITHUB_OUTPUT"

  post-deploy-smoke:
    name: post-deploy-smoke
    runs-on: ubuntu-latest
    needs: [vercel-preview, cloudflare-staging, vercel-production]
    if: always() && (needs.vercel-preview.result == 'success' || needs.cloudflare-staging.result == 'success' || needs.vercel-production.result == 'success')
    steps:
      - uses: actions/checkout@v4

      - name: Determine BASE_URL
        id: base_url
        uses: actions/github-script@v7
        with:
          script: |
            const previewResult = '${{ needs.vercel-preview.result }}';
            const stagingResult = '${{ needs.cloudflare-staging.result }}';
            const productionResult = '${{ needs.vercel-production.result }}';

            if (productionResult === 'success') {
              core.setOutput('url', process.env.VERCEL_PRODUCTION_URL || 'https://ra-med-bot.vercel.app');
            } else if (stagingResult === 'success') {
              core.setOutput('url', process.env.CLOUDFLARE_STAGING_URL || 'https://staging.ra-med-bot.pages.dev');
            } else {
              core.setOutput('url', process.env.VERCEL_PREVIEW_URL || '');
            }

      - name: Run post-deploy smoke tests
        id: smoke
        run: bash scripts/post-deploy-smoke.sh
        env:
          BASE_URL: ${{ steps.base_url.outputs.url }}
        continue-on-error: true

      - name: Mark deployment unhealthy on failure
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "Smoke tests failed for ${{ steps.base_url.outputs.url }} — marking deployment unhealthy."
          curl -sf -X POST "https://api.vercel.com/v1/deployments/mark-unhealthy" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"url":"${{ steps.base_url.outputs.url }}","reason":"post-deploy smoke test failure"}' \
            || true

      - name: Post smoke result on PR
        if: needs.vercel-preview.result == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.smoke.outcome }}';
            const icon = outcome === 'success' ? 'green_circle' : 'red_circle';
            const label = outcome === 'success' ? 'passed' : 'FAILED';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `:${icon}: Post-deploy smoke tests ${label} for preview deployment.`
            });

      - name: Post smoke result on release
        if: needs.vercel-production.result == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.smoke.outcome }}';
            const icon = outcome === 'success' ? 'green_circle' : 'red_circle';
            const label = outcome === 'success' ? 'passed' : 'FAILED';
            await github.rest.releases.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id,
              body: (context.payload.release.body || '') +
                `\n\n:${icon}: Post-deploy smoke tests ${label}.`
            });

      - name: Fail job if smoke tests failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
