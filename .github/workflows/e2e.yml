# @MX:NOTE: [AUTO] E2E CI gate — smoke (DB-free) is a required PR gate;
# full suite activates after Wave 1 completion (issue #81 closed).
# @MX:SPEC: SPEC-REGULA-CICD-001, SPEC-REGULA-QUALITY-001

name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e-smoke:
    name: E2E Smoke (DB-free)
    runs-on: ubuntu-latest

    env:
      CI: 'true'
      PLAYWRIGHT_BASE_URL: 'http://localhost:3000'
      # Placeholder env vars satisfy lib/env.ts Zod validation so pnpm dev can
      # start. Smoke tests exercise edge-middleware routing only — no DB queries
      # are executed, so the unreachable DB URL is harmless.
      DATABASE_URL: 'postgresql://postgres:test@localhost:5432/regula_ci'
      AUTH_SECRET: 'ci-smoke-test-placeholder-secret-32-chars'
      NEXTAUTH_URL: 'http://localhost:3000'
      AUTH_MICROSOFT_ID: 'dev-placeholder-microsoft-id'
      AUTH_MICROSOFT_SECRET: 'dev-placeholder-microsoft-secret'
      AUTH_GOOGLE_ID: 'dev-placeholder-google-id'
      AUTH_GOOGLE_SECRET: 'dev-placeholder-google-secret'
      ANTHROPIC_API_KEY: 'dev-placeholder-anthropic-key'
      OPENAI_API_KEY: 'dev-placeholder-openai-key'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm playwright install chromium --with-deps

      - name: Run E2E smoke tests
        run: pnpm test:e2e --project=chromium tests/e2e/smoke.spec.ts tests/e2e/security-headers.spec.ts tests/e2e/a11y.spec.ts

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Wave 1 full suite — activates when issue #81 (Wave 1 E2E Gate) is closed.
  # To enable: remove `if: false`, add e2e-full to branch protection required checks.
  e2e-full:
    name: E2E Full Suite
    runs-on: ubuntu-latest
    if: false

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: regula_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: 'true'
      PLAYWRIGHT_BASE_URL: 'http://localhost:3000'
      DATABASE_URL: 'postgresql://postgres:test@localhost:5432/regula_test'
      AUTH_SECRET: 'ci-full-test-placeholder-secret-32-chars-long'
      NEXTAUTH_URL: 'http://localhost:3000'
      AUTH_MICROSOFT_ID: 'dev-placeholder-microsoft-id'
      AUTH_MICROSOFT_SECRET: 'dev-placeholder-microsoft-secret'
      AUTH_GOOGLE_ID: 'dev-placeholder-google-id'
      AUTH_GOOGLE_SECRET: 'dev-placeholder-google-secret'
      ANTHROPIC_API_KEY: 'dev-placeholder-anthropic-key'
      OPENAI_API_KEY: 'dev-placeholder-openai-key'
      E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
      E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm db:migrate

      - name: Seed test users
        run: pnpm db:test:seed

      - name: Install Playwright Chromium
        run: pnpm playwright install chromium --with-deps

      - name: Run full E2E suite
        run: pnpm test:e2e --project=chromium

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-full
          path: playwright-report/
          retention-days: 7
