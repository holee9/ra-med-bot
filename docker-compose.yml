services:
  db:
    image: pgvector/pgvector:pg16
    container_name: regula-dev-db
    environment:
      POSTGRES_DB: regula_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d regula_dev"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - regula-dev-db:/var/lib/postgresql/data

volumes:
  regula-dev-db:
