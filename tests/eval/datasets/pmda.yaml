# PMDA (Japan) evaluation dataset
# SPEC-REGULA-LAUNCH-001 — REQ-LAUNCH-003
# 5 scenarios covering Japan PMDA medical device approval

- description: "PMDA medical device approval process in Japan"
  vars:
    query: "What is the process for obtaining medical device approval from Japan PMDA?"
    expected_citation_count: 2
    jurisdiction: "PMDA"
  assert:
    - type: javascript
      value: "output.toLowerCase().includes('pmda') && output.length > 100"

