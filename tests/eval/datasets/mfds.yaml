# MFDS (식약처) evaluation dataset
# SPEC-REGULA-LAUNCH-001 — REQ-LAUNCH-003
# 10 scenarios covering Korean MFDS medical device regulations

- description: "MFDS 의료기기법 허가 절차"
  vars:
    query: "한국 식약처(MFDS)에 의료기기 허가를 신청하는 절차는 어떻게 됩니까?"
    expected_citation_count: 3
    jurisdiction: "MFDS"
  assert:
    - type: javascript
      value: "output.length > 100"

- description: "MFDS medical device GMP certification requirements"
  vars:
    query: "What are the GMP (Good Manufacturing Practice) certification requirements for medical devices in Korea?"
    expected_citation_count: 2
    jurisdiction: "MFDS"
  assert:
    - type: javascript
      value: "output.toLowerCase().includes('gmp') && output.length > 100"

- description: "MFDS 의료기기 등급 분류"
