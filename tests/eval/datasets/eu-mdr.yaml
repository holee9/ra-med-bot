# EU MDR evaluation dataset
# SPEC-REGULA-LAUNCH-001 — REQ-LAUNCH-003
# 15 scenarios covering EU MDR 2017/745 requirements

- description: "EU MDR Article 10 general obligations of manufacturers"
  vars:
    query: "What are the general obligations of manufacturers under EU MDR Article 10?"
    expected_citation_count: 3
    jurisdiction: "EU MDR"
  assert:
    - type: javascript
      value: "output.toLowerCase().includes('mdr') && output.length > 100"

