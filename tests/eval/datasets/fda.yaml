# FDA regulatory evaluation dataset
# SPEC-REGULA-LAUNCH-001 — REQ-LAUNCH-003
# 15 scenarios covering FDA 510(k), PMA, De Novo, and related regulations

- description: "FDA 510(k) premarket notification key requirements"
  vars:
    query: "What are the key requirements for a 510(k) premarket notification submission?"
    expected_citation_count: 3
    jurisdiction: "FDA"
  assert:
    - type: javascript
      value: "output.includes('510(k)') && output.length > 100"

- description: "FDA 510(k) substantial equivalence determination"
