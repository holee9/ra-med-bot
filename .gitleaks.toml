title = "Regula gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Allow committed examples and test fixtures"
commits = []
paths = [
  '''.env\..+example$''',
  '''tests/.*\.ts$''',
]
regexes = [
  '''\.env\..*example''',
  '''sk-ant-test|test-key|fake-key|mock-key|PLACEHOLDER''',
]
